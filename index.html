<style>
/* Layout: sticky header with tab strip; each tab is a work surface (summary strip → filters → list/table); editors open as a side sheet (full screen on phones). */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --sunk:#e8ecea; --line:#d5dcd9; --fg:#18211f; --muted:#5b6965;
  --accent:#1d6b62; --accent-ink:#ffffff; --accent-soft:#d9ece8;
  --high:#1f7a3f; --high-bg:#dcf0e2; --med:#9a6200; --med-bg:#fbecc9; --low:#4b5a78; --low-bg:#e3e8f3; --none:#6c7471; --none-bg:#eceeed;
  --warn:#b0451c; --warn-bg:#fbe4da;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111816; --surface:#18211f; --sunk:#0d1312; --line:#2c3835; --fg:#e6ecea; --muted:#97a6a1;
  --accent:#5cc0b2; --accent-ink:#06201c; --accent-soft:#183a35;
  --high:#6fd08f; --high-bg:#173726; --med:#f0bb52; --med-bg:#3a2c0f; --low:#a9b8db; --low-bg:#232c40; --none:#a0aaa6; --none-bg:#232b29;
  --warn:#f39a76; --warn-bg:#3d2016; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111816; --surface:#18211f; --sunk:#0d1312; --line:#2c3835; --fg:#e6ecea; --muted:#97a6a1;
  --accent:#5cc0b2; --accent-ink:#06201c; --accent-soft:#183a35;
  --high:#6fd08f; --high-bg:#173726; --med:#f0bb52; --med-bg:#3a2c0f; --low:#a9b8db; --low-bg:#232c40; --none:#a0aaa6; --none-bg:#232b29;
  --warn:#f39a76; --warn-bg:#3d2016; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 8px}
.brand h1{font-family:var(--display);font-weight:700;font-size:1.35rem;margin:0;letter-spacing:-.01em;text-wrap:balance}
.brand small{display:block;color:var(--muted);font-size:.8rem;font-weight:500}
.sync{font-size:.75rem;color:var(--muted);white-space:nowrap}
.sync b{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--none);margin-right:6px;vertical-align:middle}
.sync.on b{background:var(--high)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:none;padding:10px 12px;border-bottom:3px solid transparent;color:var(--muted);font-weight:600;white-space:nowrap;cursor:pointer}
nav.tabs button[aria-selected="true"]{color:var(--fg);border-color:var(--accent)}
nav.tabs .count{font-family:var(--mono);font-size:.72rem;background:var(--sunk);border-radius:20px;padding:1px 6px;margin-left:5px;color:var(--muted)}
main{padding-block:20px 60px}
section.view{display:flex;flex-direction:column;gap:16px}
h2{font-family:var(--display);font-weight:700;font-size:1.5rem;margin:0;letter-spacing:-.01em}
h3{font-family:var(--display);font-weight:500;font-size:1.1rem;margin:0}
.lede{color:var(--muted);margin:0;max-width:70ch}
.head-row{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.stat .n{font-family:var(--display);font-size:1.7rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .l{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.stat .s{font-size:.82rem;color:var(--muted);overflow-wrap:anywhere}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:5px 12px;font-size:.85rem;font-weight:600;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.search{flex:1 1 200px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px}
select.sel{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 8px;max-width:100%}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--fg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:4px 10px;font-size:.82rem}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.list{display:flex;flex-direction:column;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;align-items:start;cursor:pointer;text-align:left;width:100%}
.card:hover{border-color:var(--accent)}
.datebox{width:58px;text-align:center;border-radius:8px;background:var(--sunk);padding:4px 0;font-variant-numeric:tabular-nums}
.datebox .d{font-family:var(--display);font-weight:700;font-size:1.35rem;line-height:1.1}
.datebox .m{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.datebox.tbc .d{font-size:.9rem;padding-block:6px}
.card .main{min-width:0}
.card .title{font-weight:600;font-size:1rem;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--muted);font-size:.85rem}
.meta span{overflow-wrap:anywhere}
.card .side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.pill{display:inline-block;border-radius:20px;padding:2px 9px;font-size:.75rem;font-weight:600;white-space:nowrap;background:var(--none-bg);color:var(--none)}
.pill.t-High{background:var(--high-bg);color:var(--high)}
.pill.t-Medium{background:var(--med-bg);color:var(--med)}
.pill.t-Low{background:var(--low-bg);color:var(--low)}
.pill.t-None{background:transparent;border:1px dashed var(--none);color:var(--none)}
.pill.s-booked{background:var(--accent-soft);color:var(--accent)}
.pill.s-done{background:var(--high-bg);color:var(--high)}
.pill.s-wait{background:var(--med-bg);color:var(--med)}
.pill.s-bad{background:var(--warn-bg);color:var(--warn)}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:.75rem;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--muted)}
.tag.eliza{border-color:var(--low);color:var(--low)}
.tag.david{border-color:var(--accent);color:var(--accent)}
.flag{color:var(--warn);font-size:.8rem;font-weight:600}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;background:var(--sunk);position:sticky;top:0;white-space:nowrap}
th.sortable{cursor:pointer}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:.82rem}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--sunk)}
td .sub{display:block;color:var(--muted);font-size:.78rem}
.yr{font-family:var(--mono);font-size:.78rem;white-space:nowrap}
.yr.empty{color:var(--line)}
.empty-state{border:1px dashed var(--line);border-radius:var(--r);padding:28px 18px;text-align:center;color:var(--muted)}
.muted{color:var(--muted)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0;display:flex;flex-direction:column;gap:10px}
.todo{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.todo:last-child{border-bottom:0}
.todo input[type=checkbox]{width:18px;height:18px;margin-top:3px;accent-color:var(--accent)}
.todo .t{font-weight:600;overflow-wrap:anywhere}
.todo.done .t{text-decoration:line-through;color:var(--muted)}
.todo .d{font-size:.85rem;color:var(--muted);overflow-wrap:anywhere}
.prio{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.prio.High{color:var(--warn)} .prio.Medium{color:var(--med)} .prio.Low{color:var(--muted)}
/* calendar */
.cal-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cal-head h3{min-width:170px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--line);gap:1px}
.cal .dow{background:var(--sunk);font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:6px;font-weight:600}
.cal .day{background:var(--surface);min-height:96px;padding:4px;display:flex;flex-direction:column;gap:3px;min-width:0}
.cal .day.out{background:var(--bg);opacity:.6}
.cal .day .num{font-family:var(--mono);font-size:.75rem;color:var(--muted)}
.cal .day.today .num{color:var(--accent-ink);background:var(--accent);border-radius:10px;padding:0 6px;align-self:flex-start}
.ev{border:0;text-align:left;border-radius:5px;padding:2px 5px;font-size:.74rem;line-height:1.3;cursor:pointer;background:var(--accent-soft);color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:100%}
.ev.s-done{background:var(--high-bg)} .ev.s-bad{background:var(--warn-bg)}
.ev .tm{font-family:var(--mono);font-weight:500}
.agenda{display:none}
@media (max-width:700px){
  .brand small{display:none}
  .brand h1{font-size:1.15rem}
  .brand{padding-block:10px 4px}
  .cal .day{min-height:54px}
  .cal .ev{font-size:0;padding:0;height:6px;border-radius:3px}
  .agenda{display:flex}
  .card{grid-template-columns:auto 1fr}
  .card .side{grid-column:1/-1;flex-direction:row;flex-wrap:wrap;align-items:center}
}
/* sheet */
.overlay{position:fixed;inset:0;background:rgba(10,20,18,.45);z-index:50;display:flex;justify-content:flex-end}
.sheet{background:var(--bg);width:min(640px,100%);height:100%;overflow-y:auto;box-shadow:-8px 0 30px rgba(0,0,0,.2);display:flex;flex-direction:column}
.sheet-head{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;display:flex;gap:10px;align-items:center;justify-content:space-between;z-index:2}
.sheet-head h3{font-size:1.2rem;overflow-wrap:anywhere;min-width:0}
.sheet-body{padding:16px;display:flex;flex-direction:column;gap:16px}
.sheet-foot{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.fs{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--surface);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px;margin:0}
.fs legend{font-family:var(--display);font-weight:500;font-size:1rem;padding:0 4px}
.fs .full{grid-column:1/-1}
@media (max-width:520px){.fs{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.lbl{font-size:.75rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.field textarea{min-height:76px;resize:vertical}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:20px;padding:4px 10px;font-size:.85rem;cursor:pointer;background:var(--bg)}
.checks input{accent-color:var(--accent);width:auto!important}
.field .checks label{font-size:.85rem;text-transform:none;letter-spacing:0;color:var(--fg);font-weight:500}
.checks label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.fu{display:flex;gap:8px;align-items:flex-start}
.fu input[type=checkbox]{margin-top:4px;accent-color:var(--accent);width:17px;height:17px}
.fu span{flex:1;overflow-wrap:anywhere}
.fu.done span{text-decoration:line-through;color:var(--muted)}
.history{border-left:3px solid var(--accent-soft);padding-left:10px;display:flex;flex-direction:column;gap:8px;font-size:.88rem}
.history .when{font-family:var(--mono);font-size:.75rem;color:var(--muted)}
.invite-box{border:1px solid var(--accent);background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.invite-box .row{display:flex;flex-wrap:wrap;gap:8px}
.slots{font-family:var(--mono);font-size:.82rem;display:grid;grid-template-columns:auto 1fr;gap:2px 12px}
.copyable{font-family:var(--mono);font-size:.8rem;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:180px;overflow:auto;user-select:all}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;z-index:80;font-weight:600;font-size:.9rem;max-width:calc(100% - 32px)}
.banner{border:1px solid var(--med);background:var(--med-bg);color:var(--fg);border-radius:var(--r);padding:10px 14px;font-size:.9rem}
.doclist{display:flex;flex-direction:column}
.doclist .row{display:grid;grid-template-columns:1fr auto auto;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);align-items:center;font-size:.9rem}
.doclist .row:last-child{border-bottom:0}
.bars{display:flex;gap:12px;align-items:flex-end;height:110px;padding-top:8px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;height:100%;justify-content:flex-end}
.bar i{display:block;width:100%;max-width:60px;background:var(--accent);border-radius:5px 5px 0 0}
.bar b{font-family:var(--mono);font-size:.8rem}
.bar span{font-size:.75rem;color:var(--muted)}
.handover{font-size:.95rem;max-width:75ch}
.handover li{margin-bottom:4px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(30px);opacity:.6}}}
</style>
</head>

<script>
(() => {
'use strict';
// ---------- constants ----------
const STATUSES = ['Not contacted','To email','Emailed – awaiting reply','Called – no answer','Left message','Call back later','To book online','Booked','Confirmed','Rebook needed','Cancelled','Declined – send info','Completed'];
const OUTREACH = ['Not contacted','To email','Emailed – awaiting reply','Called – no answer','Left message','Call back later','To book online','Rebook needed'];
const BOOKED = ['Booked','Confirmed'];
const DIETS = ['None','Vegetarian','Vegan','Halal','Kosher','No pork','No beef','No seafood','No sushi','Fish only','Meat','Gluten free','Dairy free','Nut allergy','Healthy options'];
const PEOPLE = ['David Berlinski','Eliza Doumakis'];
const TABS = [['lunches','GP lunches'],['calendar','Calendar'],['referrals','Referrals'],['clinics','Clinics & visits'],['prospects','Not contacted'],['flyers','Flyers'],['todo','To-do'],['settings','Settings & handover']];
const YEARS = ['2024','2025','2026'];

// ---------- state ----------
const S = { clinics:new Map(), lunches:new Map(), todos:new Map(), settings:{}, loaded:{c:0,l:0,t:0,s:0}, db:null, canWrite:true, tab:'lunches',
  f:{ lunch:'upcoming', lperson:'', lq:'', refMode:'practices', tier:'', region:'', rq:'', cq:'', cregion:'', cvisit:'', pregion:'', fshow:'open', calY:0, calM:0, sort:{k:'refTotal',d:-1}, csort:{k:'name',d:1} } };
try{ const t = localStorage.getItem('gpl-tab'); if(t && TABS.some(x=>x[0]===t)) S.tab=t; }catch(e){}
if (location.hash && TABS.some(x=>x[0]===location.hash.slice(1))) S.tab = location.hash.slice(1);

// ---------- helpers ----------
const $ = (s,el=document)=>el.querySelector(s);
const h = v => String(v ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayStr = () => new Intl.DateTimeFormat('en-CA',{timeZone:'Australia/Melbourne'}).format(new Date());
const pd = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const fmtDate = (s,opt) => s ? pd(s).toLocaleDateString('en-AU', opt||{weekday:'short',day:'numeric',month:'short',year:'numeric'}) : 'Date TBC';
const fmtTime = t => { if(!t) return ''; const [H,M]=t.split(':').map(Number); const ap=H>=12?'pm':'am'; const hh=((H+11)%12)+1; return hh+(M?':'+String(M).padStart(2,'0'):'')+ap; };
const uid = p => p+'-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60) || uid('c');
const mapUrl = (name,addr) => 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent([name,addr].filter(Boolean).join(', '));
const set = () => S.settings || {};
const gpLabel = l => l.gpCount ? `${l.gpCount} GP${l.gpCount>1?'s':''}` : 'GPs TBC';
const qs = o => Object.entries(o).filter(([k,v])=>v!==undefined&&v!=='').map(([k,v])=>encodeURIComponent(k)+'='+encodeURIComponent(v)).join('&');
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }
async function copy(text, el){ try{ await navigator.clipboard.writeText(text); toast('Copied'); }catch(e){ if(el){ const r=document.createRange(); r.selectNodeContents(el); const s=getSelection(); s.removeAllRanges(); s.addRange(r);} toast('Press Ctrl/Cmd+C to copy the selected text'); } }

function tierOf(c){ if(c.tierOverride) return c.tierOverride; const st=set(); const n=c.refTotal||0; if(!n) return 'Not referred yet'; if(n>=(st.practiceHigh||15)) return 'High'; if(n>=(st.practiceMedium||5)) return 'Medium'; return 'Low'; }
function docTier(n){ const st=set(); if(!n) return 'Not referred yet'; if(n>=(st.doctorHigh||6)) return 'High'; if(n>=(st.doctorMedium||3)) return 'Medium'; return 'Low'; }
const tierPill = t => `<span class="pill t-${t==='Not referred yet'?'None':t}">${h(t)}</span>`;
function statusClass(s){ if(BOOKED.includes(s)) return 's-booked'; if(s==='Completed') return 's-done'; if(['Cancelled','Rebook needed','Declined – send info'].includes(s)) return 's-bad'; return 's-wait'; }
const statusPill = s => `<span class="pill ${statusClass(s)}">${h(s)}</span>`;
const lunchesFor = id => [...S.lunches.values()].filter(l=>l.clinicId===id);
function visitsFor(c){
  const v = (c.visits||[]).map(x=>({date:x.date||'',year:x.year?String(x.year):(x.date?x.date.slice(0,4):''),note:x.note||'',source:x.source||''}));
  const seen = new Set(v.filter(x=>x.date).map(x=>x.date));
  for(const l of lunchesFor(c.id)) if(l.status==='Completed' && l.date && !seen.has(l.date)){ v.push({date:l.date,year:l.date.slice(0,4),note:l.davidNotes||l.notes||'',source:'GP lunch'}); seen.add(l.date); }
  return v.sort((a,b)=>(a.date||a.year||'').localeCompare(b.date||b.year||''));
}
function lastVisit(c){ const v=visitsFor(c).filter(x=>x.date); return v.length?v[v.length-1].date:((c.visits||[]).some(x=>x.year)?String(Math.max(...c.visits.filter(x=>x.year).map(x=>x.year))):''); }
function nextBooking(c){ const t=todayStr(); return lunchesFor(c.id).filter(l=>BOOKED.includes(l.status) && (!l.date||l.date>=t)).sort((a,b)=>(a.date||'9').localeCompare(b.date||'9'))[0]; }
function isContacted(c){ return (c.visits||[]).length>0 || lunchesFor(c.id).length>0 || !!c.outreachNotes; }

// time zone: Melbourne local → UTC ms
function tzOff(ms){ const p=Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:'Australia/Melbourne',hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'}).formatToParts(new Date(ms)).map(x=>[x.type,x.value])); return (Date.UTC(+p.year,+p.month-1,+p.day,+p.hour,+p.minute,+p.second)-ms)/60000; }
function melToUtc(date,time){ const [y,m,d]=date.split('-').map(Number); const [H,M]=(time||'12:00').split(':').map(Number); const g=Date.UTC(y,m-1,d,H,M); let u=g-tzOff(g)*60000; const o2=tzOff(u); u=g-o2*60000; return u; }
function isoMel(ms){ const off=tzOff(ms); const loc=new Date(ms+off*60000); const p=n=>String(n).padStart(2,'0'); const sign=off>=0?'+':'-'; const a=Math.abs(off); return `${loc.getUTCFullYear()}-${p(loc.getUTCMonth()+1)}-${p(loc.getUTCDate())}T${p(loc.getUTCHours())}:${p(loc.getUTCMinutes())}:00${sign}${p(Math.floor(a/60))}:${p(a%60)}`; }
function hhmmMel(ms){ const off=tzOff(ms); const d=new Date(ms+off*60000); return fmtTime(String(d.getUTCHours()).padStart(2,'0')+':'+String(d.getUTCMinutes()).padStart(2,'0')); }

// ---------- db ----------
// Supabase-backed store: every record is a row in the docs table (collection, id, data).
function makeDb(sb){
  const subs=new Map();
  const emit = async name => { const fns=subs.get(name)||[]; if(!fns.length) return;
    const {data,error}=await sb.from('docs').select('id,data').eq('collection',name);
    if(error){ fns.forEach(f=>f.err&&f.err(error)); return; }
    fns.forEach(f=>f.cb(data)); };
  const watch=(name,cb,err)=>{ if(!subs.has(name)) subs.set(name,[]); subs.get(name).push({cb,err}); emit(name); };
  sb.channel('docs').on('postgres_changes',{event:'*',schema:'public',table:'docs'},p=>{ const n=p.new?.collection||p.old?.collection; if(n) emit(n); else [...subs.keys()].forEach(emit); }).subscribe();
  const split=p=>{ const i=p.indexOf('/'); return [p.slice(0,i),p.slice(i+1)]; };
  const ok=r=>{ if(r.error) throw r.error; };
  return {
    collection:name=>({ onSnapshot:(cb,err)=>watch(name, rows=>cb({docs:rows.map(r=>({id:r.id,data:()=>r.data}))}), err) }),
    doc:path=>{ const [c,id]=split(path); return {
      onSnapshot:(cb,err)=>watch(c, rows=>{ const r=rows.find(x=>x.id===id); cb({exists:!!r,data:()=>r?r.data:undefined}); }, err),
      set:async data=>{ ok(await sb.from('docs').upsert({collection:c,id,data,updated_at:new Date().toISOString()})); emit(c); },
      update:async data=>{ ok(await sb.rpc('merge_doc',{p_collection:c,p_id:id,p_patch:data})); emit(c); },
      delete:async()=>{ ok(await sb.from('docs').delete().eq('collection',c).eq('id',id)); emit(c); } }; }
  };
}

async function boot(){
  render();

  if(!window.supabase || !cfg.supabaseUrl || !cfg.supabaseAnonKey || /YOUR-/.test(cfg.supabaseUrl+cfg.supabaseAnonKey)){ setSync(false,'Not set up'); $('#main').innerHTML='<div class="empty-state"><h3>The planner isn\'t connected to its database yet</h3><p>Add the Supabase project URL and anon key to config.js – see the README.</p></div>'; return; }
  const sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);
  sb.auth.onAuthStateChange(ev=>{ if(ev==='SIGNED_OUT') location.reload(); if(ev==='SIGNED_IN' && !S.db) setTimeout(()=>start(sb),0); });
  const {data:{session}}=await sb.auth.getSession();

async function start(sb){
  if(S.db) return;
  const db=S.db=makeDb(sb);
  const so=$('#signout'); so.hidden=false; so.onclick=()=>sb.auth.signOut();
  $('#main').innerHTML='<div class="empty-state">Loading clinics, lunches and to-dos…</div>';
  const {data:allowed,error}=await sb.rpc('is_allowed');
  if(error || !allowed){ S.canWrite=false; setSync(false,error?'Connection problem – reload':'No access'); if(!error){ S.db=null; $('#main').innerHTML='<div class="empty-state"><h3>This email isn\'t on the access list</h3><p>Ask the planner\'s owner to add your email address, then reload.</p></div>'; } return; }
  const onErr = e => { setSync(false, 'Connection problem – reload'); };
  db.collection('clinics').onSnapshot(snap=>{ S.clinics=new Map(snap.docs.map(d=>[d.id,{...d.data(),id:d.id}])); S.loaded.c=1; ready(); }, onErr);
  db.collection('lunches').onSnapshot(snap=>{ S.lunches=new Map(snap.docs.map(d=>[d.id,{...d.data(),id:d.id}])); S.loaded.l=1; ready(); }, onErr);
  db.collection('todos').onSnapshot(snap=>{ S.todos=new Map(snap.docs.map(d=>[d.id,{...d.data(),id:d.id}])); S.loaded.t=1; ready(); }, onErr);
  db.doc('settings/main').onSnapshot(snap=>{ S.settings=snap.exists?snap.data():{}; S.loaded.s=1; ready(); }, onErr);
}
let rt=null;
function ready(){ setSync(true, S.canWrite?'Live · shared':'Live · view only'); clearTimeout(rt); rt=setTimeout(()=>{ if(!$('.overlay')) render(); else renderTabsOnly(); },60); }
function setSync(on,txt){ const el=$('#sync'); el.className='sync'+(on?' on':''); el.querySelector('span').textContent=txt; }
async function save(path, data, merge){
  if(!S.db){ toast('Not connected'); return false; }
  if(!S.canWrite){ toast('You have view-only access – ask the owner for Contributor access'); return false; }
  try{ const ref=S.db.doc(path); if(merge) await ref.update(data); else await ref.set(data); return true; }
  catch(e){ if(e && e.code==='invalid_argument' && !merge){ toast('Couldn\'t save – this page may be view-only for you'); } else toast('Couldn\'t save ('+(e&&e.code||'error')+'). Try again.'); return false; }
}
async function del(path){ try{ await S.db.doc(path).delete(); return true; }catch(e){ toast('Couldn\'t delete'); return false; } }

// ===== Lunches =====
function lunchMatches(l){
  const t=todayStr(), f=S.f;
  const isUp = BOOKED.includes(l.status) && (!l.date||l.date>=t);
  const isPast = l.status==='Completed' || (BOOKED.includes(l.status) && l.date && l.date<t);
  const g = {upcoming:isUp, outreach:OUTREACH.includes(l.status), past:isPast, closed:['Cancelled','Declined – send info'].includes(l.status), all:true}[f.lunch];
  if(!g) return false;
  if(f.lperson && !(l.attendees||[]).includes(f.lperson)) return false;
  if(f.lq){ const q=f.lq.toLowerCase(); if(!((l.clinicName||'')+' '+(l.notes||'')+' '+(l.address||'')).toLowerCase().includes(q)) return false; }
  return true;
}

// ===== Calendar =====
function vCalendar(){
  const t=todayStr(); if(!S.f.calY){ S.f.calY=+t.slice(0,4); S.f.calM=+t.slice(5,7)-1; }
  const y=S.f.calY, m=S.f.calM; const first=new Date(y,m,1); const start=new Date(y,m,1-((first.getDay()+6)%7));
  const L=[...S.lunches.values()].filter(l=>l.date && !['Cancelled','Declined – send info'].includes(l.status));
  const byDay={}; L.forEach(l=>{(byDay[l.date]=byDay[l.date]||[]).push(l);});
  let cells=''; const days=[];
  for(let i=0;i<42;i++){ const d=new Date(start); d.setDate(start.getDate()+i); const ds=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    if(i>=35 && d.getMonth()!==m) break;
    const ev=(byDay[ds]||[]).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
    if(d.getMonth()===m) ev.forEach(e=>days.push(e));
    cells+=`<div class="day ${d.getMonth()!==m?'out':''} ${ds===t?'today':''}"><span class="num">${d.getDate()}</span>${ev.map(e=>`<button class="ev ${statusClass(e.status)}" data-open-lunch="${h(e.id)}" title="${h(e.clinicName)}"><span class="tm">${fmtTime(e.time)}</span> ${h(e.clinicName)}</button>`).join('')}</div>`; }
  const monthName=first.toLocaleDateString('en-AU',{month:'long',year:'numeric'});
  const undated=[...S.lunches.values()].filter(l=>BOOKED.includes(l.status)&&!l.date);
  return `<div class="head-row"><div><h2>Calendar</h2><p class="lede">Booked and completed GP lunches. Travel time (1 hour each way) is added to the Outlook invites, not shown here.</p></div><button class="btn primary" data-act="new-lunch">+ Add GP lunch</button></div>
  <div class="cal-head"><button class="btn small" data-cal="-1" aria-label="Previous month">‹</button><h3>${monthName}</h3><button class="btn small" data-cal="1" aria-label="Next month">›</button><button class="btn small" data-cal="0">Today</button>
   <span class="tags" style="margin-left:auto"><span class="pill s-booked">Booked</span><span class="pill s-done">Completed</span><span class="pill s-bad">Rebook</span></span></div>
  <div class="cal">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="dow">${d}</div>`).join('')}${cells}</div>
  <div class="list agenda">${days.length?days.map(lunchCard).join(''):'<div class="empty-state">No lunches this month.</div>'}</div>
  ${undated.length?`<div class="panel"><h3>Booked, date to confirm</h3><div class="list">${undated.map(lunchCard).join('')}</div></div>`:''}`;
}

   <select class="sel" id="f-cregion" data-fsel="cregion" aria-label="Region"><option value="">All regions</option>${['Bentleigh','Hawthorn East','Other'].map(r=>`<option ${f.cregion===r?'selected':''}>${r}</option>`).join('')}</select>

  ${C.map(c=>{ const v=visitsFor(c); const pre=v.filter(x=>!x.year || x.year<'2024').length; const nb=nextBooking(c); const lv=lastVisit(c); return `<tr data-open-clinic="${h(c.id)}"><td><b>${h(c.name)}</b>${c.privateGP?' <span class="tag">Private GP</span>':''}<span class="sub">${h(c.address||c.suburb||'')}</span>${c.worksAt?`<span class="sub">Works at: ${h(c.worksAt)}</span>`:''}</td><td>${tierPill(tierOf(c))}</td><td class="num">${c.refTotal||0}</td><td class="yr ${pre?'':'empty'}">${pre?'✓':'—'}</td>${YEARS.map(y=>cell(c,y)).join('')}<td class="yr">${lv?(lv.length>4?fmtDate(lv,{month:'short',year:'numeric'}):lv):'<span class="muted">Never</span>'}</td><td class="yr">${nb?(nb.date?fmtDate(nb.date,{day:'numeric',month:'short',year:'2-digit'}):'TBC'):''}</td><td><a href="${mapUrl(c.name,c.address)}" target="_blank" rel="noopener" data-stop>Map</a></td></tr>`; }).join('')}

// ===== To-do =====
function autoChecks(){
  const t=todayStr(); const out=[];
  for(const l of S.lunches.values()){
    const n=l.clinicName||'A lunch';
    if(BOOKED.includes(l.status) && l.date && l.date>=t && !l.inviteSentAt) out.push({l, text:`Send Outlook invite for ${n} (${fmtDate(l.date,{day:'numeric',month:'short'})})`});
    if(BOOKED.includes(l.status) && (!l.date||l.date>=t) && (!l.gpCount || !(l.diets||[]).length)) out.push({l, text:`Confirm ${!l.gpCount?'GP numbers':''}${!l.gpCount&&!(l.diets||[]).length?' and ':''}${!(l.diets||[]).length?'dietaries':''} for ${n}`});
    if((l.attendees||[]).includes('Eliza Doumakis') && BOOKED.includes(l.status) && !l.elizaEmailedAt) out.push({l, text:`Email Eliza the details for ${n}`});
    if(BOOKED.includes(l.status) && l.date && l.date<t) out.push({l, text:`${n} was on ${fmtDate(l.date,{day:'numeric',month:'short'})} – mark completed and add notes`});
    if(BOOKED.includes(l.status) && !(l.attendees||[]).length) out.push({l, text:`Allocate who's attending ${n}`});
  }
  return out;
}
function vTodo(){
  const T=[...S.todos.values()]; const order={High:0,Medium:1,Low:2};

  const auto=autoChecks();
  const fus=[]; for(const l of S.lunches.values()) for(const x of (l.followUps||[])) if(!x.done) fus.push({l,x});

  return `<div class="head-row"><div><h2>What needs doing</h2><p class="lede">The handover list. Manual tasks first, then checks the planner works out from the lunches, then every open follow-up on a lunch.</p></div><button class="btn primary" data-act="new-todo">+ Add task</button></div>
  <div class="panel"><h3>Tasks <span class="muted" style="font-size:.85rem">· ${open.length} open</span></h3>${open.length?open.map(todoRow).join(''):'<div class="muted">All tasks done.</div>'}</div>

   <div class="panel"><h3>Automatic checks <span class="muted" style="font-size:.85rem">· ${auto.length}</span></h3>${auto.length?auto.map(a=>`<div class="todo"><span class="flag" aria-hidden="true">●</span><div class="t" style="font-weight:500">${h(a.text)}</div><button class="btn small" data-open-lunch="${h(a.l.id)}">Open</button></div>`).join(''):'<div class="muted">Nothing flagged.</div>'}</div>
   <div class="panel"><h3>Lunch follow-ups <span class="muted" style="font-size:.85rem">· ${fus.length}</span></h3>${fus.length?fus.map(({l,x})=>`<div class="todo"><input type="checkbox" id="fu-${h(x.id)}" data-fu="${h(l.id)}|${h(x.id)}" aria-label="Done"><div style="min-width:0"><div class="t" style="font-weight:500">${h(x.text)}</div><div class="d">${h(l.clinicName)} · ${h(l.status)}</div></div><button class="btn small" data-open-lunch="${h(l.id)}">Open</button></div>`).join(''):'<div class="muted">No open follow-ups.</div>'}</div>

function fuList(l){ return (l.followUps||[]).length ? (l.followUps.map(x=>`<div class="fu ${x.done?'done':''}"><input type="checkbox" data-efu="${h(x.id)}" ${x.done?'checked':''} aria-label="Done"><span>${h(x.text)}</span><button class="btn small" type="button" data-rmfu="${h(x.id)}" aria-label="Remove">✕</button></div>`).join('')) : '<div class="muted" style="font-size:.88rem">Nothing to follow up.</div>'; }
function clinicHistory(c, exceptId){
  if(!c) return '';
  const items=[...(c.noteLog||[]).filter(n=>n.lunchId!==exceptId)];
  for(const l of lunchesFor(c.id)) if(l.id!==exceptId && l.davidNotes && !items.some(n=>n.lunchId===l.id)) items.push({date:l.date,author:"David's notes",text:l.davidNotes,lunchId:l.id});
  if(c.notes) items.push({date:'',author:'Clinic notes',text:c.notes});
  if(c.outreachNotes) items.push({date:'',author:'Earlier outreach',text:c.outreachNotes});
  if(!items.length) return '';
  items.sort((a,b)=>(b.date||'').localeCompare(a.date||''));

function readLunchForm(){

async function saveLunch(){
  const l=readLunchForm();
  if(!l.clinicName){ toast('Add the clinic name'); $('#e-clinic').focus(); return; }
  if(l.date && l.date>=todayStr() && OUTREACH.concat(['Not contacted']).includes(l.status)){ l.status='Booked'; }
  if(BOOKED.includes(l.status) && !l.date){ toast('Booked lunches need a date – or keep the status as “Call back later” until it\'s set'); }
  // create clinic if new
  if(!l.clinicId){
    let id=slug(l.clinicName); while(S.clinics.has(id)) id+='-2';
    const c={id,name:l.clinicName,address:l.address,suburb:'',region:'',phone:l.contactPhone,email:l.contactEmail,website:'',contact:l.contactName,refTotal:0,refYears:{},lastReferral:null,doctors:[],visits:[],flyerNeeded:false,flyerDone:false,flyerReason:'',noLunches:false,notes:'',outreachNotes:'',sources:['Added in planner'],isNew:false,noteLog:[],tierOverride:'',contacted:true};
    if(!(await save('clinics/'+id,c))) return; l.clinicId=id; S.clinics.set(id,c);
  } else {
    const c=S.clinics.get(l.clinicId); const upd={};
    if(l.address && !c.address) upd.address=l.address;
    if(l.davidNotes && l.davidNotes.trim()){ const log=(c.noteLog||[]).filter(n=>n.lunchId!==l.id); log.push({date:l.date||todayStr(),author:"David's notes"+(l.attendees?.length?' ('+l.attendees.map(p=>p.split(' ')[0]).join(', ')+')':''),text:l.davidNotes.trim(),lunchId:l.id}); upd.noteLog=log; }
    if(Object.keys(upd).length) await save('clinics/'+c.id,upd,true);
  }
  const changed = EDIT.orig !== JSON.stringify({d:l.date,t:l.time,a:l.attendees,s:l.status,addr:l.address});
  const wasNew=l._new; const prev=S.lunches.get(l.id);
  if(changed && BOOKED.includes(l.status)){ l.inviteSentAt=''; if(prev && JSON.stringify(prev.attendees)!==JSON.stringify(l.attendees)) l.elizaEmailedAt=''; }
  delete l._new; l.updatedAt=todayStr();
  if(!(await save('lunches/'+l.id,l))) return;
  S.lunches.set(l.id,l);
  toast('Saved');
  if(BOOKED.includes(l.status) && l.date && (!l.inviteSentAt || wasNew)){ openInvites(l, true); return; }
  if(l.status==='Cancelled' && prev && prev.inviteSentAt){ openInvites(l, true, true); return; }
  closeSheet();
}

// --- invites ---
function slotTimes(l){
  const st=set(); const len=(st.lunchMinutes??60)*60000, tr=(st.travelMinutes??60)*60000;
  const s=melToUtc(l.date,l.time||'12:30'); return { t1:s-tr, s, e:s+len, t2:s+len+tr };
}
function recipients(l){ const st=set(); const to=[]; if(st.davidEmail) to.push(st.davidEmail); if((l.attendees||[]).includes('Eliza Doumakis') && st.elizaEmail) to.push(st.elizaEmail); return to; }
function detailsText(l){
  const c=S.clinics.get(l.clinicId);
  const lines=[`GP lunch – ${l.clinicName}`, `When: ${fmtDate(l.date,{weekday:'long',day:'numeric',month:'long',year:'numeric'})}, ${fmtTime(l.time)} (1 hr GP slot)`, `Address: ${l.address||'TBC'}`, `Map: ${mapUrl(l.clinicName,l.address)}`, `Number of GPs: ${l.gpCount||'TBC'}${l.gpNames?' – '+l.gpNames:''}`, `Dietary: ${(l.diets||[]).join(', ')||'TBC'}${l.dietNotes?' – '+l.dietNotes:''}`, `Attending: ${(l.attendees||[]).join(', ')||'TBC'}`];
  if(l.contactName||l.contactPhone) lines.push(`Clinic contact: ${[l.contactName,l.contactPhone,l.contactEmail].filter(Boolean).join(' · ')}`);
  if(c) lines.push(`Referrals from this practice: ${c.refTotal||0} (${tierOf(c)})`);
  if(l.notes) lines.push('', 'Notes: '+l.notes);
  const lastNote=(c?.noteLog||[]).filter(n=>n.lunchId!==l.id).slice(-1)[0];
  if(lastNote) lines.push('', `Last visit notes (${lastNote.date}): ${lastNote.text}`);
  lines.push('', 'Travel: 1 hour blocked before and after.');
  return lines.join('\n');
}

  const st=set(); const host=st.outlookHost==='live'?'https://outlook.live.com':'https://outlook.office.com';
  const T=slotTimes(l); const n=gpLabel(l);

    pre:{subject:`Travel to ${l.clinicName} (GP lunch at ${tm})`,s:T.t1,e:T.s,body:`1 hour travel to the GP lunch at ${l.clinicName}.\nLunch starts ${tm} (${n}).\n${l.address}\n${mapUrl(l.clinicName,l.address)}`},
    post:{subject:`Travel back from ${l.clinicName}`,s:T.e,e:T.t2,body:`1 hour return travel after the GP lunch at ${l.clinicName}.`} }[which];
  const to=recipients(l);

}

  if(t.dataset.csort){ const k=t.dataset.csort; S.f.csort = S.f.csort.k===k?{k,d:-S.f.csort.d}:{k,d:k==='name'?1:-1}; render(); return; }
  if(t.dataset.openLunch){ e.preventDefault(); openLunch(t.dataset.openLunch); return; }
  if(t.dataset.openClinic){ e.preventDefault(); openClinic(t.dataset.openClinic); return; }
  if(t.dataset.start){ const c=S.clinics.get(t.dataset.start); const ex=lunchesFor(c.id).find(l=>!['Completed','Cancelled'].includes(l.status)); if(ex){ openLunch(ex.id); toast('This clinic already has an open booking'); } else openLunch(null,newLunch(c)); return; }
  if(t.dataset.editTodo){ openTodo(t.dataset.editTodo); return; }
  if(t.dataset.copyEl){ const el=document.getElementById(t.dataset.copyEl); copy(el.textContent, el); return; }
  if(t.dataset.rmfu){ EDIT.l.followUps=EDIT.l.followUps.filter(x=>x.id!==t.dataset.rmfu); $('#e-fus').innerHTML=fuList(EDIT.l); return; }
  if(t.hasAttribute('data-close')){ closeSheet(); return; }
  const a=t.dataset.act;
  if(a==='new-lunch') openLunch(null,newLunch(null));
  if(a==='save-lunch') saveLunch();
  if(a==='add-fu'){ const v=$('#e-newfu').value.trim(); if(v){ EDIT.l.followUps=[...(EDIT.l.followUps||[]),{id:uid('f'),text:v,done:false}]; $('#e-fus').innerHTML=fuList(EDIT.l); $('#e-newfu').value=''; } }
  if(a==='del-lunch'){ const c=$('#del-confirm'); if(!c.innerHTML){ c.innerHTML=' <button class="btn small danger" data-act="del-lunch-yes">Yes, delete</button>'; } }
  if(a==='del-lunch-yes'){ if(await del('lunches/'+EDIT.l.id)){ S.lunches.delete(EDIT.l.id); toast('Deleted'); closeSheet(); } }
  if(a==='copy-details'){ copy(detailsText(EDIT.l)); }
  if(a==='copy-eliza'){ const m=elizaEmail(EDIT.l); copy(`To: ${m.to}\nSubject: ${m.subject}\n\n${m.body}`); }
  if(a==='mark-invite' || a==='mark-eliza'){ const field=a==='mark-invite'?'inviteSentAt':'elizaEmailedAt'; const stamp=new Date().toLocaleDateString('en-AU',{day:'numeric',month:'short'}); const l=S.lunches.get(EDIT.l.id); if(!l){ toast('Save the lunch first'); return; } if(await save('lunches/'+l.id,{[field]:stamp},true)){ EDIT.l[field]=stamp; l[field]=stamp; $('#e-invite').innerHTML=inviteBox(EDIT.l); toast('Marked as sent'); } }
  if(a==='new-clinic') openNewClinic();
  if(a==='save-new-clinic') saveNewClinic();
  if(a==='add-doc'){ const n=$('#c-newdoc').value.trim().replace(/^dr\.?\s+/i,''); if(!n) return; const c=S.clinics.get(S._clinic); const docs=[...(c.doctors||[]),{name:n,refs:0,years:{},last:null,source:'Added in planner',web:false}]; if(await save('clinics/'+c.id,{doctors:docs},true)){ c.doctors=docs; openClinic(c.id); } }
  if(a==='add-visit'){ const d=$('#c-vdate').value; if(!d){ toast('Pick the visit date'); return; } const c=S.clinics.get(S._clinic); const vis=[...(c.visits||[]),{date:d,year:+d.slice(0,4),note:$('#c-vnote').value.trim(),source:'Added in planner'}]; if(await save('clinics/'+c.id,{visits:vis},true)){ c.visits=vis; openClinic(c.id); } }
  if(a==='add-note'){ const n=$('#c-newnote').value.trim(); if(!n) return; const c=S.clinics.get(S._clinic); const log=[...(c.noteLog||[]),{date:todayStr(),author:'Note',text:n}]; if(await save('clinics/'+c.id,{noteLog:log},true)){ c.noteLog=log; openClinic(c.id); } }
  if(a==='new-todo') openTodo(null);
  if(a==='save-todo'){ const x=S._todo; x.title=$('#t-title').value.trim(); if(!x.title){ toast('Give the task a name'); return; } x.detail=$('#t-detail').value; x.priority=$('#t-prio').value; x.due=$('#t-due').value; x.owner=$('#t-owner').value.trim(); x.category=$('#t-cat').value.trim(); delete x._new; if(await save('todos/'+x.id,x)){ S.todos.set(x.id,x); toast('Saved'); closeSheet(); } }
  if(a==='del-todo'){ const c=$('#del-confirm'); if(!c.innerHTML) c.innerHTML=' <button class="btn small danger" data-act="del-todo-yes">Yes, delete</button>'; }
  if(a==='del-todo-yes'){ if(await del('todos/'+S._todo.id)){ S.todos.delete(S._todo.id); closeSheet(); } }
});
document.addEventListener('change', async e=>{
  const t=e.target;
  if(t.dataset.fsel){ S.f[t.dataset.fsel]=t.value; render(); return; }
  if(t.dataset.todo){ const x=S.todos.get(t.dataset.todo); if(await save('todos/'+x.id,{done:t.checked},true)){ x.done=t.checked; render(); } return; }
  if(t.dataset.flyer){ const c=S.clinics.get(t.dataset.flyer); if(await save('clinics/'+c.id,{flyerDone:t.checked},true)){ c.flyerDone=t.checked; toast(t.checked?'Marked dropped off':'Moved back to the list'); render(); } return; }
  if(t.dataset.fu){ const [lid,fid]=t.dataset.fu.split('|'); const l=S.lunches.get(lid); const fus=(l.followUps||[]).map(x=>x.id===fid?{...x,done:t.checked}:x); if(await save('lunches/'+lid,{followUps:fus},true)){ l.followUps=fus; render(); } return; }
  if(t.dataset.efu){ EDIT.l.followUps=EDIT.l.followUps.map(x=>x.id===t.dataset.efu?{...x,done:t.checked}:x); $('#e-fus').innerHTML=fuList(EDIT.l); return; }
  if(t.id==='e-clinic'){ const c=[...S.clinics.values()].find(c=>c.name.toLowerCase()===t.value.trim().toLowerCase()); if(c){ if(!$('#e-addr').value) $('#e-addr').value=c.address||''; if(!$('#e-cphone').value) $('#e-cphone').value=c.phone||''; if(!$('#e-cemail').value) $('#e-cemail').value=c.email||''; if(!$('#e-cname').value) $('#e-cname').value=c.contact||''; } updateMap(); }
  if(t.id==='e-addr') updateMap();
  if(t.id==='e-date' && t.value && OUTREACH.concat(['Not contacted']).includes($('#e-status').value)){ $('#e-status').value='Booked'; toast('Status set to Booked'); }
  if(['e-status','e-date','e-time','e-gps'].includes(t.id) || t.name==='e-att' || t.name==='e-diet'){ readLunchForm(); $('#e-invite').innerHTML=inviteBox(EDIT.l); }
});
function updateMap(){ const n=$('#e-clinic').value.trim(), a=$('#e-addr').value.trim(); $('#e-maplink').innerHTML=(n||a)?`<a href="${mapUrl(n,a)}" target="_blank" rel="noopener">Open in Google Maps ↗</a>`:''; }
let inT=null;
document.addEventListener('input', e=>{ const t=e.target; if(t.dataset.fin){ S.f[t.dataset.fin]=t.value; clearTimeout(inT); inT=setTimeout(render,150); } });
document.addEventListener('submit', async e=>{
  e.preventDefault();
  if(e.target.id==='clinic-form') saveClinicForm();
  if(e.target.id==='newclinic-form') saveNewClinic();
  if(e.target.id==='todo-form') document.querySelector('[data-act="save-todo"]').click();
  if(e.target.id==='settings-form'){ const n=id=>+$('#'+id).value; const upd={davidEmail:$('#s-david').value.trim(),elizaEmail:$('#s-eliza').value.trim(),outlookHost:$('#s-host').value,travelMinutes:n('s-travel'),lunchMinutes:n('s-len'),practiceHigh:n('s-ph'),practiceMedium:n('s-pm'),doctorHigh:n('s-dh'),doctorMedium:n('s-dm'),updatedAt:todayStr()}; if(upd.practiceMedium>=upd.practiceHigh||upd.doctorMedium>=upd.doctorHigh){ toast('“Medium from” must be lower than “High from”'); return; } if(await save('settings/main',{...S.settings,...upd})){ toast('Settings saved'); } }
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && $('.overlay')) closeSheet(); if(e.key==='Enter' && e.target.id==='e-newfu'){ e.preventDefault(); document.querySelector('[data-act="add-fu"]').click(); } });

boot();
})();
</script>

</body>
